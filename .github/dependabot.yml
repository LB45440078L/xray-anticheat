# =====================================================================================
#  Dependabot
# =====================================================================================
#  Weekly dependency updates for Maven, the GitHub Actions used by the workflows, and the
#  Python visualiser's requirements.
#
#  IMPORTANT — the four runtime libraries are pinned in TWO places:
#
#     HikariCP, sqlite-jdbc, mariadb-java-client and postgresql appear as <...version>
#     properties in the root pom.xml AND as coordinates under `libraries:` in
#     xray-paper/src/main/resources/plugin.yml.
#
#  Dependabot can only update the first. A PR that bumps one of those four will therefore
#  fail the build in tools/ci/verify_jar.sh with a version-drift error telling you to update
#  plugin.yml to match. That failure is the guard working, not Dependabot being broken:
#  taking the version change without the plugin.yml change would produce a plugin that
#  compiles cleanly and dies at runtime. Edit plugin.yml in the same PR and it goes green.
#
#  paper-api is exempt from that rule — it is `provided` and never enters the jar.
# =====================================================================================
version: 2

updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR for routine bumps instead of a dozen.
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "tools"
