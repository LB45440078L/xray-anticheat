# =====================================================================================
#  XRay AntiCheat — main configuration
# =====================================================================================
#
#  Every value here is read by the plugin and has a real effect. Nothing in this file is a
#  placeholder. Defaults are the values the code uses when a key is absent.
#
#  Guidance for administrators, in order of how much they matter:
#
#   1. `ores.*.hidden-discovery-rate-per-1000-blocks` and `ore-informed-rate-multiplier` are the
#      most consequential numbers in the file. They express how many BURIED ore veins a legitimate
#      miner finds per thousand blocks of rock moved, and how many an ore-vision user would find.
#      They are priors, not measured constants. Get the order of magnitude right and the rest of the
#      model is robust; a factor-of-two error shifts the accumulated evidence slightly rather than
#      flipping verdicts.
#
#   2. `suspicion.enforcement-mode` defaults to ALERT_ONLY. Run it that way for a while. The system
#      produces evidence and alerts without touching players, which is how you build confidence that
#      your ore priors suit your world before anything irreversible happens.
#
#   3. `analysis.evidence.minimum-sample-size` and `minimum-independent-groups` are the guard rails
#      that stop a handful of lucky finds from becoming a verdict. Raising them costs you detection
#      speed; lowering them buys detection speed at the cost of false positives.
# =====================================================================================

config-version: 3

analysis:
  # Master switch for the analytical engine. When false the plugin still records data (so nothing is
  # lost) but performs no assessment and raises no alerts.
  enabled: true

  # Worlds to analyse, by world name. `["*"]` means every world. Keep the nether and the overworld
  # both listed if you mine in both; their ore distributions are modelled separately by the ore
  # profiles below, so mixing them in this list is safe.
  worlds:
    - "*"

  exposure:
    # Whether an opening through a corner (diagonally past a block edge) counts as making an ore
    # visible. Off by default: in vanilla, corner peeking through a single diagonal gap is possible
    # but awkward, and enabling it classifies genuinely hidden ores as visible, weakening detection.
    diagonal-visibility: false

    # Openings that the OBSERVING PLAYER created within this many seconds before reaching an ore are
    # treated as the player's own approach excavation and do NOT count as pre-existing exposure.
    # This is what makes a strip-mined ore register as genuinely buried rather than as "visible".
    # Raise it if your players mine slowly through long tunnels; lower it if you see strip-miners
    # being credited with exposure they did not have.
    recent-excavation-window-seconds: 90

    # How far to search for a natural vantage point with line of sight when an ore is fully enclosed.
    # 1 means the immediately adjacent diagonals; 3 is the practical maximum before the question
    # "could they have seen it from there" stops being meaningful.
    occupied-space-radius: 1

    # When true, an opening whose origin cannot be attributed is not accepted as natural exposure and
    # the classification is reported with reduced confidence instead. Enable this if you have other
    # plugins heavily modifying terrain and you would rather see uncertainty than a guess.
    excavation-attribution-required: false

  evidence:
    # Prior probability that an arbitrary player is using ore vision, before any behaviour is seen.
    # 0.02 is deliberately low: on a normal server the overwhelming majority of players are honest,
    # and a low prior means real evidence has to do the work rather than a default suspicion.
    prior-probability: 0.02

    # Half-life, in hours, of an observation's evidentiary weight (w(t) = 2^(-t/halfLife)).
    # One week. Behaviour changes and accounts change hands; a signal from last month should not
    # weigh what it did on the day.
    half-life-hours: 168.0

    # k in the sample-size shrinkage factor n/(n+k). With k = 5 a component backed by two
    # observations contributes about 29% of its nominal weight; one backed by fifty contributes 91%.
    # This is the mechanism that prevents "three lucky finds" from moving the verdict.
    sample-size-shrink-k: 5.0

    # n0 in the sample-adequacy term (1 - exp(-n/n0)) of the confidence calculation.
    confidence-sample-scale: 20.0

    # g0 in the independence-adequacy term (1 - exp(-g/g0)) of the confidence calculation.
    confidence-group-scale: 2.0

    # Minimum number of independent observations before ANY conclusion may be drawn. Below this the
    # verdict is reported as "insufficient evidence" no matter how extreme the numbers look.
    minimum-sample-size: 10

    # Minimum number of independent SIGNAL FAMILIES that must contribute before a conclusion may be
    # drawn. This is the anti-evasion rule: one signal, however strong, is evadable, so the system
    # refuses to act on a single family. Values above 2 are more conservative and much slower.
    minimum-independent-groups: 2

    # How far from an ore, in blocks, the player's heading is sampled to measure "were they already
    # heading for it". Far enough that the ore is still comfortably out of sight; close enough that
    # the heading is about this ore.
    lookback-distance-blocks: 8.0

    # Proportion of a legitimate player's ore discoveries that are buried rather than cave-exposed.
    # This is world-dependent: a world with vast open cave systems produces far more exposed finds.
    # Tune this UP if your world is mostly solid stone, DOWN if it is riddled with caves.
    legitimate-hidden-fraction: 0.55

    # The corresponding proportion for an ore-vision user, who has no reason to spend effort on ore
    # they could have found honestly.
    ore-informed-hidden-fraction: 0.95

  # ---------------------------------------------------------------------------------------
  # Accumulating evidence over a player's whole recorded time
  # ---------------------------------------------------------------------------------------
  # A session's in-memory window used to be all the engine ever saw, so every restart and every idle
  # prune began the evidence base again from nothing: a cheater was measured against a few hours, and a
  # ban wave could never be justified by conduct that had really lasted months. With this enabled the
  # stored record is read back and folded into each assessment, so the numbers on a player's page
  # describe their whole recorded time rather than the current login.
  #
  # The reads happen on the analysis worker, never on the server thread, and a hydrated history is
  # cached for `refresh-minutes` so this does not become one query per player per pass.
  history:
    enabled: true

    # How far back an assessment reaches. It must not exceed retention.mining-events-days, because the
    # trajectory is rebuilt from those stored block breaks and a longer lookback than the retention can
    # only be honoured for discoveries, not for movement. The two are equal by default; the mismatch is
    # reported at startup rather than left to show up as an unexplained cap on the geometry signal.
    #
    # Raise this and retention.mining-events-days together if you want evidence to span longer: raising
    # only this one changes nothing for the trajectory, and raising only the retention changes nothing
    # for the window.
    lookback-days: 30

    # Per-player read limits. These bound the cost of a single assessment: without them one very active
    # player could turn every pass into an unbounded query and an enormous merged trajectory.
    max-discoveries: 2000
    max-mining-events: 20000

    # How long a hydrated history is reused before it is read again.
    refresh-minutes: 15

suspicion:
  enabled: true

  # ALERT_ONLY — never acts on a player; produces alerts and evidence only.
  # IMMEDIATE — acts as soon as the configured certainty is reached.
  # BAN_WAVE  — holds candidates and enforces in batches (see `ban-wave`). DEFAULT.
  #
  # BAN_WAVE is the default because it is the only mode in which the ban-wave machinery does anything:
  # under ALERT_ONLY nothing is ever held as a candidate, so a player's record never accrues towards
  # enforcement no matter how long they play. Whether a wave bans by itself is a separate switch
  # (`ban-wave.automatic-ban`, still false by default), so this default gathers and schedules evidence
  # without punishing anyone unreviewed. Set it back to ALERT_ONLY to have no enforcement path at all.
  enforcement-mode: BAN_WAVE

  # Two independent gates. Both must open. The first is the evidence band; the second is how much
  # that assessment can be trusted given sample size and signal independence.
  minimum-confidence-for-alert: 0.5
  minimum-confidence-for-ban: 0.75

  # Evidence band required for each action. Valid values, weakest to strongest:
  #   INSUFFICIENT, WEAK, MODERATE, STRONG, VERY_STRONG
  minimum-strength-for-alert: MODERATE
  minimum-strength-for-flag: STRONG
  minimum-strength-for-kick: STRONG
  minimum-strength-for-ban: VERY_STRONG

ban-wave:
  enabled: true

  # Minutes that must elapse between waves. One day by default.
  interval-minutes: 1440

  # How long a candidate stays eligible before its evidence is considered stale and it is dropped.
  # Two weeks. A player flagged once, months ago, with nothing since, should not be banned on the
  # strength of a stale signal.
  candidate-ttl-hours: 336

  minimum-strength: STRONG
  minimum-confidence: 0.85
  minimum-independent-signals: 2

  # Minimum number of eligible candidates before a wave is worth running. A wave of one is just a
  # delayed immediate ban, which defeats the purpose of batching.
  minimum-candidates: 2

  # false — the wave produces a list for a moderator to approve (`/xray banwave approve`).
  # true  — the wave bans automatically when it runs.
  automatic-ban: false


# =====================================================================================
#  ALERTS — how staff hear about what the plugin finds
# =====================================================================================
alerts:
  # Minutes for which further alerts about the SAME player are suppressed once one has been
  # delivered. Without this a persistently flagged player produces an alert on every analysis
  # pass, which buries the staff channel within minutes. The suppressed alerts are counted
  # and reported on the next one, so nothing is hidden, only deferred. Set to 0 to disable.
  throttle-minutes: 5

  # -----------------------------------------------------------------------------------
  # Forwarding to a Discord channel
  # -----------------------------------------------------------------------------------
  # This is what tells you about a player while nobody is online to see the in-game alert.
  # Step-by-step setup, including how to create the webhook, is in docs/DISCORD.md.
  #
  # A webhook URL is a credential: anyone holding it can post to your channel. Treat it like
  # a password, and note that regenerating it in Discord invalidates the old one immediately.
  discord:
    enabled: false

    # Paste the channel webhook here. It must start with https:// — the plugin refuses a
    # plain HTTP address so the credential is never transmitted in clear text.
    webhook-url: ""

    # How the message is attributed in the channel.
    username: "XRay AntiCheat"

    # Optional. A role ID (not the role name) to ping alongside the message, so the
    # notification reaches a phone even when the channel is muted. Get the ID by turning on
    # Developer Mode in Discord, right-clicking the role, and choosing "Copy Role ID".
    mention-role-id: ""

    # Which events are forwarded. Valid values: ALERT, KICK, BAN, BAN_WAVE.
    events:
      - ALERT
      - KICK
      - BAN
      - BAN_WAVE

    # The same two gates the plugin uses in game: the evidence band, and how far the sample
    # behind it can be trusted. Both must be met before a message is sent.
    # Bands, weakest to strongest: INSUFFICIENT, WEAK, MODERATE, STRONG, VERY_STRONG.
    minimum-strength: MODERATE
    minimum-confidence: 0.5

    # How long to wait for Discord before giving up, in seconds. Sends happen off the server
    # thread, so a slow Discord cannot stall the game; this only bounds how long a worker
    # spends on one message.
    timeout-seconds: 5


# =====================================================================================
#  ENFORCEMENT
# =====================================================================================
enforcement:
  # Run your own commands instead of the plugin's built-in kick and ban.
  #
  # This is for servers that already run a punishment system — a network-wide ban plugin, a
  # temporary-ban manager, a Discord bridge — and do not want this plugin writing to the
  # vanilla ban list behind that system's back.
  #
  # Leave a key empty ("") to keep the built-in behaviour for that action.
  #
  # Two things happen regardless of what is configured here:
  #   * the player is disconnected, because that is what a kick or a ban means;
  #   * the plugin still writes its own audit row, because the reason a player was removed
  #     must remain answerable even when the punishment is recorded somewhere else.
  #
  # Commands are dispatched as the console, so do not prefix them with a slash. They may use
  # these placeholders: %player%, %uuid%, %world%, %reason%, %strength%, %confidence%,
  # %score%, %samples%, %signals%, %decibans%, %snapshot-id%, %moderator%.
  #
  # Example, for a server running a network ban plugin:
  #   ban: "networkban %player% 30d %reason%"
  commands:
    kick: ""
    ban: ""
    # Falls back to `ban` when left empty.
    ban-wave: ""
    # Run on every alert, in addition to the in-game alert. Useful for a logging bridge.
    alert: ""

  # Log every command that is dispatched. Turn this on while trying a new template: it is the
  # only way to see exactly what the plugin ran.
  log-commands: false


# =====================================================================================
#  ORE MODELS
# =====================================================================================
# Each ore gets its own parameters because their generation genuinely differs: diamond in small
# deep clusters, emerald in tiny single-block veins restricted to mountains, ancient debris in
# sparse one-to-three-block clumps at great depth in the nether. Sharing one model between them
# would either drown emerald in noise or make ancient debris look impossible.
#
# block-keys accepts namespaced material names. Both the stone and deepslate variants of an ore
# should be listed; they are merged into a single vein during reconstruction.
# =====================================================================================
ores:

  diamond:
    enabled: true
    display-name: "Diamond"
    block-keys:
      - "minecraft:diamond_ore"
      - "minecraft:deepslate_diamond_ore"

    # Buried diamond veins a legitimate miner finds per 1000 blocks of rock moved.
    hidden-discovery-rate-per-1000-blocks: 1.5

    # How many times more buried veins an ore-vision user is modelled as finding per block moved.
    # They waste far less rock getting to each vein, which is what raises their rate per block.
    ore-informed-rate-multiplier: 6.0

    min-y: -64
    max-y: 16
    typical-vein-size: 4
    expected-distance-between-discoveries: 400.0

    # Angular tolerance, in degrees, within which an approach counts as "aimed at the ore".
    alignment-threshold-degrees: 30.0

    # Probability that a LEGITIMATE player's direction of travel is within the tolerance of a given
    # buried ore. Deliberately high: a strip-miner walks straight and mines whatever is ahead, so
    # the ore they reach is almost by construction in front of them. Rewarding this strongly would
    # flag every strip-miner.
    legitimate-move-alignment-probability: 0.5
    informed-move-alignment-probability: 0.8

    # Probability that a LEGITIMATE player's CAMERA points within the tolerance of a buried ore.
    # 0.067 is not a guess: it is the fraction of all directions inside a 30-degree cone,
    # (1 - cos 30)/2. A player repeatedly aiming into solid rock exactly where a vein sits is doing
    # something that baseline says should be rare, which is why this signal is the sharper one.
    legitimate-look-alignment-probability: 0.067
    informed-look-alignment-probability: 0.5

    # Relative weight of this ore's evidence in the combined total.
    evidence-weight: 1.0

  emerald:
    enabled: true
    display-name: "Emerald"
    block-keys:
      - "minecraft:emerald_ore"
      - "minecraft:deepslate_emerald_ore"
    hidden-discovery-rate-per-1000-blocks: 0.35
    ore-informed-rate-multiplier: 6.0
    min-y: -16
    max-y: 320
    typical-vein-size: 2
    expected-distance-between-discoveries: 900.0
    alignment-threshold-degrees: 30.0
    legitimate-move-alignment-probability: 0.5
    informed-move-alignment-probability: 0.8
    legitimate-look-alignment-probability: 0.067
    informed-look-alignment-probability: 0.5
    evidence-weight: 1.0

  ancient_debris:
    enabled: true
    display-name: "Ancient Debris"
    block-keys:
      - "minecraft:ancient_debris"
    hidden-discovery-rate-per-1000-blocks: 2.5
    ore-informed-rate-multiplier: 4.0
    min-y: 8
    max-y: 119
    typical-vein-size: 2
    expected-distance-between-discoveries: 300.0
    alignment-threshold-degrees: 30.0
    legitimate-move-alignment-probability: 0.5
    informed-move-alignment-probability: 0.8
    legitimate-look-alignment-probability: 0.067
    informed-look-alignment-probability: 0.5
    evidence-weight: 1.0

  # Iron is the ore most often targeted on survival servers: it is the one every player needs
  # and the one an ore-vision client profits from most in the early game. Its prior is far
  # higher than diamond's, because iron is abundant and a legitimate miner finds buried iron
  # often. A low prior here would treat ordinary mining as suspicious, which is the failure
  # this whole model exists to avoid.
  #
  # The multiplier is lower than diamond's for the same reason. Iron is common enough that
  # seeing it through rock is a smaller advantage than seeing diamond, and claiming otherwise
  # would flag players who simply mine a great deal.
  iron:
    enabled: true
    display-name: "Iron"
    block-keys:
      - "minecraft:iron_ore"
      - "minecraft:deepslate_iron_ore"
    hidden-discovery-rate-per-1000-blocks: 12.0
    ore-informed-rate-multiplier: 5.0
    min-y: -64
    max-y: 320
    typical-vein-size: 6
    expected-distance-between-discoveries: 60.0
    alignment-threshold-degrees: 30.0
    legitimate-move-alignment-probability: 0.5
    informed-move-alignment-probability: 0.8
    legitimate-look-alignment-probability: 0.067
    informed-look-alignment-probability: 0.5
    evidence-weight: 0.9

  # Example of adding an ore the plugin does not model by default. Set `enabled: true` to use it.
  # Give it its own rate and multiplier rather than copying another ore's, or it will be measured
  # against the wrong baseline.
  nether_gold:
    enabled: false
    display-name: "Nether Gold"
    block-keys:
      - "minecraft:nether_gold_ore"
    hidden-discovery-rate-per-1000-blocks: 8.0
    ore-informed-rate-multiplier: 3.0
    min-y: 10
    max-y: 117
    typical-vein-size: 5
    expected-distance-between-discoveries: 150.0
    alignment-threshold-degrees: 30.0
    legitimate-move-alignment-probability: 0.5
    informed-move-alignment-probability: 0.8
    legitimate-look-alignment-probability: 0.067
    informed-look-alignment-probability: 0.5
    evidence-weight: 0.8


# =====================================================================================
#  TRACKING — what is held in memory for each online player
# =====================================================================================
tracking:
  # Minimum movement, in blocks, before a new path sample is recorded. PlayerMoveEvent fires many
  # times per tick; sampling every event would cost far more than it is worth. 0.5 blocks preserves
  # the geometry that matters.
  movement-sample-distance: 0.5

  # Bounded buffers. Player tracking must not grow without limit: these caps are enforced by
  # discarding the oldest entries, and they are what keep memory flat on a server with hundreds of
  # players. Raising them improves the reach of the trajectory analysis at a linear memory cost.
  path-buffer-size: 512
  mining-buffer-size: 2048
  discovery-history-size: 200

  # How often, in minutes, each tracked player's accumulated window is analysed even when nothing
  # notable has happened. Periodic analysis is what lets the system conclude "this player mined a
  # great deal and found nothing unusual", which is real exculpatory evidence, rather than only
  # noticing players who do find things.
  analysis-interval-minutes: 5

  # Minutes without meaningful activity after which an online-but-idle player's buffers are released.
  session-idle-timeout-minutes: 30


# =====================================================================================
#  PERFORMANCE
# =====================================================================================
performance:
  # Threads used for statistical analysis and database work. These tasks are I/O-bound and
  # CPU-light, so a small pool is correct. The Minecraft server thread never performs any of this
  # work; see docs/PERFORMANCE.md.
  analysis-threads: 4

  # Whether to use virtual threads (Java 21+) for the worker pool. Recommended: the work is
  # blocking-I/O-heavy, which is exactly what virtual threads are for. Set false to fall back to a
  # fixed platform-thread pool.
  use-virtual-threads: true

  # Rows per JDBC batch on bulk writes.
  persistence-batch-size: 500

  # How often, in seconds, queued observations are flushed to the database.
  flush-interval-seconds: 10

  # Upper bound on the size of a reconstructed ore vein. Real veins are a handful of blocks; this
  # bound exists so a pathologically large blob cannot turn one block break into an unbounded
  # world scan on the server thread.
  max-vein-size: 64

  # Maximum entries retained in the in-memory excavation ledger, which is what lets the exposure
  # analyser answer "who dug this, and when" without touching the database on the server thread.
  # At roughly 100 bytes per entry, 2,000,000 entries is on the order of 200 MB. Lower this on
  # memory-constrained servers; the consequence is only that older excavation provenance is
  # forgotten, which makes the analyser more likely to report UNKNOWN rather than to guess.
  ledger-max-entries: 2000000

  # Hours of excavation provenance to keep in memory. Entries older than this are pruned.
  ledger-retention-hours: 72


# =====================================================================================
#  RETENTION — how long stored data is kept. Nothing is kept forever.
# =====================================================================================
retention:
  # Fine-grained block breaks. The largest table by far. The default is 30 days so that the trajectory
  # rebuilt from stored mining events reaches as far back as analysis.history.lookback-days; shortening
  # it below the lookback quietly caps the tunnel-geometry signal, and startup will say so.
  mining-events-days: 30
  ore-discoveries-days: 90
  suspicion-snapshots-days: 180
  # The excavation ledger in the database. Longer than mining events, because provenance is what
  # distinguishes "found a hidden ore" from "walked into somebody else's tunnel".
  world-modifications-days: 30

  # Ban-wave records are deliberately NOT pruned, and there is no setting for it: they are the
  # enforcement audit trail, the answer to "when was this player removed, and on what evidence?".
  # A wave runs at most daily, so the table holds a few hundred rows a year, and pruning it would
  # cost more in lost accountability than it could ever save in disk space. The only bound is
  # ban-wave.candidate-ttl-hours, which expires candidates that were never acted on.

  # Whether a scheduled task prunes expired rows at all. Disable only if you manage retention
  # yourself with an external job.
  enabled: true

  # Hour of the day (0-23, server local time) at which the daily prune runs.
  prune-hour: 4


# =====================================================================================
#  Administration web panel
# =====================================================================================
#  A moderator console served by the plugin itself, from an embedded HTTP server that uses
#  nothing but the JDK. It adds no dependency and no measurable length to the plugin jar,
#  and it is what you use when you do not want to be in-game to review evidence.
#
#  Read this before enabling it anywhere:
#    * It speaks plain HTTP. There is no TLS, because terminating it would need either a
#      dependency or a certificate lifecycle this feature cannot own.
#    * It authenticates with ONE username and password.
#    * It is therefore DISABLED by default, and bound to loopback when enabled.
#
#  To reach it from another machine, tunnel to it. This needs no configuration change:
#      ssh -L 8099:127.0.0.1:8099 you@yourserver
#  Then open http://127.0.0.1:8099 on your own machine. Binding it to a public interface
#  instead is possible but must be an explicit decision - see allow-non-loopback.
web:
  enabled: false

  # Loopback by default. Anything else requires allow-non-loopback below.
  bind-address: 127.0.0.1
  port: 8099

  username: admin

  # The password is stored as a PBKDF2-HMAC-SHA256 hash, never in clear text.
  # Leave this empty: on first start the plugin generates a strong random password,
  # prints it once to the console and writes the hash here. Set it by hand with
  #   /xray webpassword <new-password>
  # which hashes it for you and never writes the password itself to disk.
  password-hash: ''

  # How long an idle session stays valid. A session also expires after 12 hours regardless.
  session-minutes: 60

  # Failed sign-ins from one address before it is locked out, and for how long.
  max-failed-logins: 5
  lockout-minutes: 15

  # Rows per page in the listings.
  page-size: 25

  # Must be true before any non-loopback bind-address is accepted. The panel is
  # password-protected over plain HTTP; on a public interface that is a moderation console
  # in the clear, and this flag exists so that is never an accident.
  allow-non-loopback: false

  # When true, every moderation action is refused and the panel becomes read-only
  # inspection. The interface hides the controls and the audit trail keeps recording.
  read-only: false

  # Only enable when a reverse proxy you control always sets X-Forwarded-For. If the panel
  # is directly reachable, an attacker can forge that header and evade the login lockout.
  behind-proxy: false

debug:
  # Master switch for verbose logging. It can also be toggled at runtime with /xray debug, which
  # flips the effective value without editing this file; this value is the state a reload restores.
  enabled: false

  # Log the full evidence explanation for every assessment. Implies `enabled`. Useful when
  # calibrating your ore priors and deciding whether `enforcement-mode` should be raised beyond
  # ALERT_ONLY.
  log-analysis: false
