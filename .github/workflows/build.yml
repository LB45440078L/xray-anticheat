# =====================================================================================
#  XRay AntiCheat — continuous integration
# =====================================================================================
#  Builds the project, runs the whole test suite (including the SQLite integration tests)
#  and verifies the packaged jar.
#
#  NOTE: this workflow was validated by its first real run, on the push that published this
#  repository (run "build" on be52fb6, completed successfully). Before that it had never been
#  executed, because GitHub Actions was not reachable from the environment the repository was
#  assembled in. Everything it invokes is also run locally by `mvn clean verify` plus
#  `bash tools/ci/verify_jar.sh`.
# =====================================================================================
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and verify the jar (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The project compiles with maven.compiler.release=25, so JDK 25 is what the build
      # needs. It is deliberately not the newest JDK: the point of the release setting is
      # to prove the code stays within Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # verify, not just test: this builds the shaded jar too, so a broken shade
      # configuration fails here rather than at release time.
      - name: Build and test
        run: mvn -B -ntp clean verify

      # Checks that cannot be made from the modules' own output, because the unit tests run
      # against unshaded classes: bytecode level, shipped resources, JDBC driver service
      # registrations, and that sqlite-jdbc was not relocated.
      - name: Verify the packaged jar
        # Invoked through bash on purpose: the executable bit is not tracked, so the
        # script behaves identically in a Windows checkout and on the CI runner.
        run: bash tools/ci/verify_jar.sh

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: xray-anticheat-jar
          path: xray-spigot/target/xray-anticheat-*.jar
          if-no-files-found: error

  python-tool:
    name: Python visualiser syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The visualiser is a standalone tool, not part of the plugin build. Syntax only:
      # running it needs NumPy/pandas/Matplotlib and a database fixture that does not
      # exist in the repository.
      - name: Compile the tool
        run: python -m py_compile tools/xray_visualizer.py
